<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open only the emails and sign-in codes shared with your Mailgrant access key.">
  <title>Shared Access · Mailgrant</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./access.css">
  <script type="module" src="./theme.js"></script>
  <script type="module" src="./access.js"></script>
</head>
<body>
  <div class="access-wrap">
    <header class="access-header">
      <a class="brand" href="./index.html" aria-label="Mailgrant Home">
        <span class="brand-mark" style="display:grid; place-items:center; background:var(--blue); color:#fff; width:34px; height:34px; border-radius:10px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:18px;height:18px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </span>
        <span>mailgrant</span>
        <span class="tag-beta" style="font-size:10px; font-weight:700; background:var(--blue-light); color:var(--blue); border:1px solid var(--blue-border); padding:2px 7px; border-radius:99px;">RECIPIENT</span>
      </a>

      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn small" data-theme-toggle aria-label="Toggle light or dark theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <span style="font-size:12px;">Theme</span>
        </button>
        <a class="btn small" href="/docs.html">Guide</a>
        <a class="btn small primary" href="/app.html">Owner sign-in →</a>
      </div>
    </header>

    <main id="shared-app">
      <div class="intro">
        <div style="width:40px; height:40px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--blue); animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
        <p style="font-size:14px; color:var(--muted);">Checking your saved access…</p>
      </div>
    </main>

    <footer class="access-footer">
      <div>Access is strictly limited to the senders selected by the mailbox owner.</div>
      <div style="margin-top:6px;">
        <a href="/docs.html">How key sharing works →</a> · <a href="/privacy.html">Privacy details</a> · <a href="/">Mailgrant Home</a>
      </div>
    </footer>
  </div>

  <dialog id="shared-dialog" aria-labelledby="shared-dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
