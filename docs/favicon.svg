<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyan glow gradient -->
    <linearGradient id="mg-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Coral orange gradient -->
    <linearGradient id="mg-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#FF4336"/>
    </linearGradient>

    <!-- Warm gold gradient -->
    <linearGradient id="mg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- OpenAI teal gradient -->
    <linearGradient id="mg-openai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- OTT violet-red gradient -->
    <linearGradient id="mg-ott" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Envelope interior dark -->
    <linearGradient id="mg-env-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>

    <!-- Outer border glow gradient -->
    <linearGradient id="mg-border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>

    <!-- Outer halo filter -->
    <filter id="mg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Neon Glow Path -->
  <path d="M32 5 L53 19 C55 20.4 56 22.6 56 25 L56 47 C56 50.3 53.3 53 50 53 L14 53 C10.7 53 8 50.3 8 47 L8 25 C8 22.6 9 20.4 11 19 Z"
        fill="#070C18"
        stroke="url(#mg-border-glow)"
        stroke-width="3"
        stroke-linejoin="round"
        filter="url(#mg-glow)"/>

  <!-- Inner Envelope Body -->
  <path d="M32 8 L51 21 C52 21.8 52.5 23 52.5 24.5 L52.5 46.5 C52.5 48.4 51 50 49 50 L15 50 C13 50 11.5 48.4 11.5 46.5 L11.5 24.5 C11.5 23 12 21.8 13 21 Z"
        fill="url(#mg-env-bg)"/>

  <!-- Top Tiles Inside Envelope Flap -->
  <!-- Left Tile: Streaming / Play -->
  <rect x="18" y="18" width="8" height="8" rx="2" fill="url(#mg-ott)"/>
  <polygon points="21,20 21,24 25,22" fill="#FFFFFF"/>

  <!-- Center Tile: OpenAI / AI Brain -->
  <rect x="28" y="14" width="8" height="8" rx="2" fill="url(#mg-openai)"/>
  <circle cx="32" cy="18" r="2.2" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  <circle cx="32" cy="18" r="0.8" fill="#FFFFFF"/>

  <!-- Right Tile: Key / Secret -->
  <rect x="38" y="18" width="8" height="8" rx="2" fill="url(#mg-gold)"/>
  <!-- Key icon -->
  <circle cx="41" cy="21" r="1.3" stroke="#FFFFFF" stroke-width="0.8" fill="none"/>
  <path d="M42 22 L44.5 24.5 M43.5 23.5 L44.2 22.8" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Circuit connection lines down to handshake -->
  <path d="M22 26 C22 29 27 30 29 33" stroke="#00F0FF" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M32 22 L32 32" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M42 26 C42 29 37 30 35 33" stroke="#FF7A59" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Left Cyan Envelope Flap -->
  <path d="M11.5 26 L26 38 L11.5 49 Z" fill="#0E4E63" opacity="0.6"/>
  <path d="M11.5 26 L25 36.5" stroke="#00F0FF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Key symbol on left flap -->
  <circle cx="16" cy="35" r="1.5" stroke="#00F0FF" stroke-width="0.9" fill="none"/>
  <line x1="16" y1="36.5" x2="16" y2="41" stroke="#00F0FF" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="39" x2="17.5" y2="39" stroke="#00F0FF" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Right Coral Envelope Flap -->
  <path d="M52.5 26 L38 38 L52.5 49 Z" fill="#7C2D12" opacity="0.6"/>
  <path d="M52.5 26 L39 36.5" stroke="#FF7A59" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Shield with check on right flap -->
  <path d="M47 34 L47 37.5 C47 40 44.5 41.5 44.5 41.5 C44.5 41.5 42 40 42 37.5 L42 34 L44.5 33 Z"
        fill="#071927" stroke="#00F0FF" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M43.5 37 L44.5 38 L46 35.8" stroke="#00F0FF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Handshake in Envelope Front -->
  <!-- Bottom Envelope Fold Front -->
  <path d="M11.5 49.5 L24 40 L40 40 L52.5 49.5 Z" fill="#0C1425" stroke="#1E293B" stroke-width="1"/>

  <!-- Handshake Graphics -->
  <!-- Left Hand (Cyan / Blue Team) -->
  <path d="M18 43 L26 38 C27 37.5 28.5 38 29.5 39 L33 42.5 L30 45.5 L26 42.5 L18 46 Z" fill="url(#mg-cyan)"/>
  <!-- Right Hand (Warm Peach / Coral Recipient) -->
  <path d="M46 43 L38 38 C37 37.5 35.5 38 34.5 39 L31.5 42 L34 45.5 L38 42.5 L46 46 Z" fill="url(#mg-coral)"/>

  <!-- Handshake Clasp Detail -->
  <ellipse cx="32" cy="42" rx="2.5" ry="1.8" fill="#FDBA74"/>
  <path d="M30 43 C30.5 44.5 33.5 44.5 34 43" stroke="#0F172A" stroke-width="0.7" fill="none"/>
</svg>
