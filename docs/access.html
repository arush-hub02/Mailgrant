<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Open only the emails and sign-in codes shared with your Mailgrant access key.">
  <meta name="theme-color" content="#0a0e1a">
  <title>Recipient Portal · Mailgrant — Hassle-free OTPs</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <script>
    if (location.pathname === '/access.html') {
      location.replace('/access' + location.search + location.hash);
    }
  </script>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/access.css">
  <script type="module" src="/theme.js"></script>
  <script type="module" src="/access.js"></script>
</head>
<body>
  <div class="access-wrap">
    <header class="access-header">
      <div class="access-header-brand-wrap">
        <a class="brand" href="/" aria-label="Mailgrant Home">
          <span class="brand-mark access-brand-mark" aria-hidden="true">
            <img src="/images/mailgrant-mark.png" alt="Mailgrant" class="brand-mark-img" width="30" height="30" />
          </span>
          <span class="brand-title">Mail<span class="brand-gradient-text">grant</span></span>
          <span class="recipient-tag">RECIPIENT</span>
        </a>
      </div>

      <div class="header-controls">
        <button type="button" class="btn small theme-pill-btn" data-theme-toggle aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/></svg>
          <span class="theme-btn-label">Theme</span>
        </button>
        <a class="btn small guide-header-btn" href="/docs">Guide</a>
        <a class="btn small primary owner-signin-btn" href="/signin">Sign in →</a>
      </div>
    </header>

    <main id="shared-app">
      <div class="intro">
        <div class="loading-spinner"></div>
        <p style="font-size:14px; color:var(--muted);">Verifying your authorized access…</p>
      </div>
    </main>

    <footer class="access-footer">
      <div class="footer-privacy-text">
        Selective zero-trust delivery · Access is cryptographically limited to senders approved by the workspace administrator.
      </div>
      <div class="footer-links-row">
        <a href="/docs">How key sharing works →</a>
        <span class="sep">·</span>
        <a href="/privacy">Privacy details</a>
        <span class="sep">·</span>
        <a href="/">Mailgrant Home</a>
      </div>
    </footer>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <style>
    .loading-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--accent-bright);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
